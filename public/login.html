<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Feedo</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="login-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <img src="/logo.png" alt="Feedo" style="width:36px; height:36px; object-fit:contain; display:block;" />
      </div>
      <div class="auth-logo-title">Feedo</div>
      <div class="auth-logo-sub">Video review &amp; collaboration</div>
    </div>

    <!-- Tab row -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-signin" type="button">Sign In</button>
      <button class="auth-tab" id="tab-signup" type="button">Sign Up</button>
    </div>

    <!-- Sign In form -->
    <form class="auth-form" id="login-form" autocomplete="off">
      <div id="login-error" class="auth-error">Incorrect email or password. Please try again.</div>
      <div class="form-group">
        <label class="form-label" for="username-input">Email or Username</label>
        <input
          class="form-input"
          type="text"
          id="username-input"
          placeholder="Enter email or username…"
          autocomplete="username"
          autofocus
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="password-input">Password</label>
        <input
          class="form-input"
          type="password"
          id="password-input"
          placeholder="Enter password…"
          autocomplete="current-password"
        />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">
        Sign In
      </button>
    </form>

    <!-- Sign Up form (hidden by default) -->
    <form class="auth-form" id="signup-form" autocomplete="off" style="display:none;">
      <div id="signup-error" class="auth-error"></div>
      <div class="form-group">
        <label class="form-label" for="signup-name-input">Your Name</label>
        <input
          class="form-input"
          type="text"
          id="signup-name-input"
          placeholder="Enter your name…"
          autocomplete="name"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-email-input">Email</label>
        <input
          class="form-input"
          type="email"
          id="signup-email-input"
          placeholder="Enter your email…"
          autocomplete="email"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-password-input">Password</label>
        <input
          class="form-input"
          type="password"
          id="signup-password-input"
          placeholder="At least 8 characters…"
          autocomplete="new-password"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-confirm-input">Confirm Password</label>
        <input
          class="form-input"
          type="password"
          id="signup-confirm-input"
          placeholder="Repeat password…"
          autocomplete="new-password"
        />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">
        Create Account
      </button>
    </form>
  </div>
</div>

<div id="toast-container"></div>

<script src="/utils.js"></script>
<script src="/login.js"></script>
</body>
</html>
